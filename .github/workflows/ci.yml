name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS ${{ matrix.macOS }})
    runs-on: ${{ matrix.macOS }}
    strategy:
      fail-fast: false
      matrix:
        macOS: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --disable-sandbox

      - name: Test
        run: swift test --disable-sandbox

      - name: Release build (sanity check)
        run: swift build -c release --disable-sandbox
